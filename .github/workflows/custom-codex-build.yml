name: Project AGENT Integration

on:
  workflow_dispatch:
  push:
    branches:
      - research-state

permissions:
  contents: read

concurrency:
  group: project-agent-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: Validate project AGENT integration
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Linux sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Check changed crates with Clippy
        env:
          RUST_MIN_STACK: 8388608
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            codex-extension-api
            codex-project-agents
            codex-project-agents-extension
            codex-app-server-protocol
            codex-app-server
            codex-core
            codex-tui
          )
          for package in "${packages[@]}"; do
            echo "::group::Clippy ${package}"
            cargo clippy --locked --tests --no-deps -p "${package}" -- -D warnings
            echo "::endgroup::"
          done

      - name: Test extension API
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-extension-api

      - name: Test project AGENT persistence
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-project-agents

      - name: Test project AGENT registration CLI
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-cli --test agents

      - name: Test project AGENT runtime extension
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-project-agents-extension

      - name: Regenerate app-server schema
        run: just write-app-server-schema

      - name: Upload generated app-server schema
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-server-schema-${{ github.sha }}
          path: codex-rs/app-server-protocol/schema
          if-no-files-found: error
          retention-days: 7

      - name: Test app-server protocol
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-app-server-protocol

      - name: Test app-server integration
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-app-server

      - name: Test core collaboration policy
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-core

      - name: Test TUI and snapshots
        env:
          RUST_MIN_STACK: 8388608
        run: just test -p codex-tui

      - name: Upload pending TUI snapshots
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pending-tui-snapshots-${{ github.sha }}
          path: codex-rs/tui/src/**/snapshots/*.snap.new
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify app-server schema is committed
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- app-server-protocol/schema)" ]]; then
            git status --short -- app-server-protocol/schema
            git diff -- app-server-protocol/schema
            exit 1
          fi

  build-windows:
    name: Build custom codex.exe
    runs-on: windows-latest
    timeout-minutes: 360
    needs:
      - validate-linux
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Restore Windows Cargo build cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: windows-codex-dev-small-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            windows-codex-dev-small-${{ hashFiles('codex-rs/Cargo.lock') }}-

      - name: Build Codex for Windows
        shell: bash
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: |
          cargo build \
            --locked \
            --profile dev-small \
            --target x86_64-pc-windows-msvc \
            --package codex-cli \
            --bin codex

      - name: Stage custom binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item `
            "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\dev-small\codex.exe" `
            "dist\codex-custom.exe"

      - name: Upload custom Windows binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-custom-windows-x64
          path: codex-rs/dist/codex-custom.exe
          if-no-files-found: error
          retention-days: 14
