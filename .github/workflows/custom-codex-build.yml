name: Custom Codex Build

on:
  workflow_dispatch:
  push:
    branches:
      - research-state

permissions:
  contents: read

concurrency:
  group: custom-codex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test research-state integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Test project agents foundation
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-project-agents

      - name: Test project agents CLI
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-cli --test agents

      - name: Test project agents runtime extension
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-project-agents-extension

      - name: Test research-state crate
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-research-state

      - name: Test research persistence
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-state runtime::research::tests

      - name: Test Git project identity evidence
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-git-utils root_commit_hashes_are_stable_after_new_commits

      - name: Test protocol crate
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-protocol

      - name: Test core plan integration
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-core plan

      - name: Test core project-agent tool visibility
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-core tool_visibility_policy_filters_code_mode_capabilities_before_building_transport

      - name: Test core research context projection
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-core research_context

      - name: Test Responses Lite instruction roles
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test --locked -p codex-core responses_lite_uses_system_message_for_instructions_and_input_tools
          cargo test --locked -p codex-core responses_lite_uses_developer_message_for_non_openai_provider

      - name: Generate app-server schema
        run: cargo run --locked -p codex-app-server-protocol --bin write_schema_fixtures

      - name: Upload generated app-server schema
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-server-schema-${{ github.sha }}
          path: codex-rs/app-server-protocol/schema
          if-no-files-found: error
          retention-days: 7

      - name: Test app-server research-state protocol
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --locked -p codex-app-server-protocol

      - name: Test app-server research-state projection
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test --locked -p codex-app-server test_handle_turn_research_state_update_emits_notification_for_v2
          cargo test --locked -p codex-app-server project_agents

      - name: Test TUI research-state cell
        env:
          RUST_MIN_STACK: 8388608
        run: |
          cargo test --locked -p codex-tui research_state_update_renders_revision_and_entries
          cargo test --locked -p codex-tui project_agent_maintenance

      - name: Clippy Stage 3 project-agent surfaces
        env:
          RUST_MIN_STACK: 8388608
        shell: bash
        run: |
          set +e
          packages=(
            codex-project-agents
            codex-cli
            codex-project-agents-extension
            codex-protocol
            codex-core
            codex-app-server-protocol
            codex-app-server
            codex-mcp-server
            codex-rollout
            codex-rollout-trace
            codex-tui
          )
          failed_packages=()
          : > stage3-clippy.log

          for package in "${packages[@]}"; do
            echo "::group::Clippy ${package}" | tee -a stage3-clippy.log
            cargo clippy --locked --tests --no-deps -p "${package}" -- -D warnings \
              2>&1 | tee -a stage3-clippy.log
            package_status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if (( package_status != 0 )); then
              failed_packages+=("${package}")
            fi
          done

          if (( ${#failed_packages[@]} != 0 )); then
            printf 'Stage 3 Clippy failed packages: %s\n' "${failed_packages[*]}" \
              | tee -a stage3-clippy.log "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Stage 3 Clippy passed for all packages." \
            | tee -a stage3-clippy.log "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage 3 Clippy log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stage3-clippy-${{ github.sha }}
          path: codex-rs/stage3-clippy.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify app-server schema is committed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- app-server-protocol/schema)" ]]; then
            git status --short -- app-server-protocol/schema
            git diff -- app-server-protocol/schema
            exit 1
          fi

  build-windows:
    name: Build custom codex.exe
    runs-on: windows-latest
    # The first Windows build has no compiled Rust cache. Keep a generous
    # ceiling, while the dev-small profile below avoids release LTO and is
    # substantially faster for iteration builds.
    timeout-minutes: 360
    needs:
      - test-linux
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Restore Windows Cargo build cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: windows-codex-dev-small-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            windows-codex-dev-small-${{ hashFiles('codex-rs/Cargo.lock') }}-

      - name: Build Codex for Windows
        shell: bash
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: |
          cargo build \
            --locked \
            --profile dev-small \
            --target x86_64-pc-windows-msvc \
            --package codex-cli \
            --bin codex

      - name: Stage custom binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item `
            "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\dev-small\codex.exe" `
            "dist\codex-custom.exe"

      - name: Upload custom Windows binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-custom-windows-x64
          path: codex-rs/dist/codex-custom.exe
          if-no-files-found: error
          retention-days: 14
