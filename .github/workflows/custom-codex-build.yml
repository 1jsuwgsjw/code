name: Project AGENT Windows Build

on:
  workflow_dispatch:
    inputs:
      generate_schema:
        description: Generate and upload app-server schema fixtures
        required: false
        default: false
        type: boolean
  push:
    branches:
      - research-state

permissions:
  contents: read

concurrency:
  group: project-agent-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build custom codex.exe
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Restore Windows Cargo build cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: windows-codex-dev-small-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            windows-codex-dev-small-${{ hashFiles('codex-rs/Cargo.lock') }}-

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest

      - name: Generate app-server schema fixtures
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_schema }}
        shell: bash
        run: just write-app-server-schema

      - name: Upload app-server schema fixtures
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_schema }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-server-schema
          path: codex-rs/app-server-protocol/schema
          if-no-files-found: error
          retention-days: 7

      - name: Test app-server protocol
        shell: bash
        run: just test -p codex-app-server-protocol

      - name: Test app-server
        shell: bash
        run: just test -p codex-app-server

      - name: Build Codex for Windows
        shell: bash
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: |
          cargo build \
            --locked \
            --profile dev-small \
            --target x86_64-pc-windows-msvc \
            --package codex-cli \
            --bin codex

      - name: Stage custom binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item `
            "$env:CARGO_TARGET_DIR\x86_64-pc-windows-msvc\dev-small\codex.exe" `
            "dist\codex-custom.exe"

      - name: Upload custom Windows binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-custom-windows-x64
          path: codex-rs/dist/codex-custom.exe
          if-no-files-found: error
          retention-days: 14
