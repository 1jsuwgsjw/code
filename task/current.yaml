execution_reminder:
  version: 1
  required: true
  principles:
  - 结果可用优先：每一步必须直接推进用户可见、可运行、可验证的最终结果。
  - 先找直达底部路径：开始和换路前必须检查能否从最终状态、最终写入者或最终消费者反推，禁止因当前路线熟悉而忽略更短路径。
  - 中间产物不是结果：捕获、扫描、报告、日志、候选和工具成功本身不计进度，除非它立即解锁下一次结果性动作。
  - 时间盒到点即停：同一点超时或达到停止条件后，记录完成/未完成/卡点并换路，禁止重复挂点、扩大扫描或无限溯源。
  - 真实状态汇报：未产生可用效果就明确写未完成，不得用命中、闭合、在找或有进度替代可用结果。
  questions:
    A: 当前方向真的直接决定最终可用结果吗？如果不是，立即降级或停止。
    B: 是否存在可以直接到底部的方法范式，只因当前认为不必要或把现场当实验而没有使用？如果存在，优先切换。
    C: 是否完整执行了任务技能和项目准则，而不是只做了其中方便的部分？不完整则先修正执行方式。
