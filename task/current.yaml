known_information:
- install_pending_checkpoint 通过 project_history 把 checkpoint 放在稳定前缀与 open tail 的边界。
- run_sampling_request 随后每次请求都删除已有 CheckpointRecordFragment 并 push 到 prompt_input
  末尾；open tail 增长时 checkpoint 的绝对位置持续后移，破坏 prompt prefix cache，并让 user-role checkpoint
